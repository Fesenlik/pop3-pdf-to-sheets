name: Daily POP3 PDF to Sheets

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Debug secrets and vars presence
        env:
          POP3_HOST_SECRET: ${{ secrets.POP3_HOST }}
          POP3_PORT_SECRET: ${{ secrets.POP3_PORT }}
          POP3_USERNAME_SECRET: ${{ secrets.POP3_USERNAME }}
          POP3_PASSWORD_SECRET: ${{ secrets.POP3_PASSWORD }}
          MAIL_FROM_CONTAINS_SECRET: ${{ secrets.MAIL_FROM_CONTAINS }}
          MAIL_SUBJECT_CONTAINS_SECRET: ${{ secrets.MAIL_SUBJECT_CONTAINS }}
          APPS_SCRIPT_WEBHOOK_URL_SECRET: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
          WEBHOOK_SECRET_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          POP3_HOST_VAR: ${{ vars.POP3_HOST }}
          POP3_PORT_VAR: ${{ vars.POP3_PORT }}
          POP3_USERNAME_VAR: ${{ vars.POP3_USERNAME }}
          POP3_PASSWORD_VAR: ${{ vars.POP3_PASSWORD }}
          MAIL_FROM_CONTAINS_VAR: ${{ vars.MAIL_FROM_CONTAINS }}
          MAIL_SUBJECT_CONTAINS_VAR: ${{ vars.MAIL_SUBJECT_CONTAINS }}
          APPS_SCRIPT_WEBHOOK_URL_VAR: ${{ vars.APPS_SCRIPT_WEBHOOK_URL }}
          WEBHOOK_SECRET_VAR: ${{ vars.WEBHOOK_SECRET }}
        run: |
          check_pair() {
            local name="$1"
            local s="$2"
            local v="$3"
            if [ -n "$s" ]; then
              echo "$name: SECRET_OK"
            elif [ -n "$v" ]; then
              echo "$name: VAR_OK"
            else
              echo "$name: MISSING"
            fi
          }
          check_pair "POP3_HOST" "$POP3_HOST_SECRET" "$POP3_HOST_VAR"
          check_pair "POP3_PORT" "$POP3_PORT_SECRET" "$POP3_PORT_VAR"
          check_pair "POP3_USERNAME" "$POP3_USERNAME_SECRET" "$POP3_USERNAME_VAR"
          check_pair "POP3_PASSWORD" "$POP3_PASSWORD_SECRET" "$POP3_PASSWORD_VAR"
          check_pair "MAIL_FROM_CONTAINS" "$MAIL_FROM_CONTAINS_SECRET" "$MAIL_FROM_CONTAINS_VAR"
          check_pair "MAIL_SUBJECT_CONTAINS" "$MAIL_SUBJECT_CONTAINS_SECRET" "$MAIL_SUBJECT_CONTAINS_VAR"
          check_pair "APPS_SCRIPT_WEBHOOK_URL" "$APPS_SCRIPT_WEBHOOK_URL_SECRET" "$APPS_SCRIPT_WEBHOOK_URL_VAR"
          check_pair "WEBHOOK_SECRET" "$WEBHOOK_SECRET_SECRET" "$WEBHOOK_SECRET_VAR"

      - name: Ensure processed state file exists
        run: |
          if [ ! -f processed_ids.json ]; then
            echo '{"processed_ids":[]}' > processed_ids.json
          fi

      - name: Write runtime config
        env:
          POP3_HOST_SECRET: ${{ secrets.POP3_HOST }}
          POP3_PORT_SECRET: ${{ secrets.POP3_PORT }}
          POP3_USERNAME_SECRET: ${{ secrets.POP3_USERNAME }}
          POP3_PASSWORD_SECRET: ${{ secrets.POP3_PASSWORD }}
          MAIL_FROM_CONTAINS_SECRET: ${{ secrets.MAIL_FROM_CONTAINS }}
          MAIL_SUBJECT_CONTAINS_SECRET: ${{ secrets.MAIL_SUBJECT_CONTAINS }}
          APPS_SCRIPT_WEBHOOK_URL_SECRET: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
          WEBHOOK_SECRET_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          POP3_HOST_VAR: ${{ vars.POP3_HOST }}
          POP3_PORT_VAR: ${{ vars.POP3_PORT }}
          POP3_USERNAME_VAR: ${{ vars.POP3_USERNAME }}
          POP3_PASSWORD_VAR: ${{ vars.POP3_PASSWORD }}
          MAIL_FROM_CONTAINS_VAR: ${{ vars.MAIL_FROM_CONTAINS }}
          MAIL_SUBJECT_CONTAINS_VAR: ${{ vars.MAIL_SUBJECT_CONTAINS }}
          APPS_SCRIPT_WEBHOOK_URL_VAR: ${{ vars.APPS_SCRIPT_WEBHOOK_URL }}
          WEBHOOK_SECRET_VAR: ${{ vars.WEBHOOK_SECRET }}
        run: |
          POP3_HOST="${POP3_HOST_SECRET:-$POP3_HOST_VAR}"
          POP3_PORT="${POP3_PORT_SECRET:-$POP3_PORT_VAR}"
          POP3_USERNAME="${POP3_USERNAME_SECRET:-$POP3_USERNAME_VAR}"
          POP3_PASSWORD="${POP3_PASSWORD_SECRET:-$POP3_PASSWORD_VAR}"
          MAIL_FROM_CONTAINS="${MAIL_FROM_CONTAINS_SECRET:-$MAIL_FROM_CONTAINS_VAR}"
          MAIL_SUBJECT_CONTAINS="${MAIL_SUBJECT_CONTAINS_SECRET:-$MAIL_SUBJECT_CONTAINS_VAR}"
          APPS_SCRIPT_WEBHOOK_URL="${APPS_SCRIPT_WEBHOOK_URL_SECRET:-$APPS_SCRIPT_WEBHOOK_URL_VAR}"
          WEBHOOK_SECRET="${WEBHOOK_SECRET_SECRET:-$WEBHOOK_SECRET_VAR}"

          : "${POP3_HOST:?Missing POP3_HOST (set repo Secret or Variable)}"
          : "${POP3_PORT:?Missing POP3_PORT (set repo Secret or Variable)}"
          : "${POP3_USERNAME:?Missing POP3_USERNAME (set repo Secret or Variable)}"
          : "${POP3_PASSWORD:?Missing POP3_PASSWORD (set repo Secret or Variable)}"
          : "${MAIL_FROM_CONTAINS:?Missing MAIL_FROM_CONTAINS (set repo Secret or Variable)}"
          : "${MAIL_SUBJECT_CONTAINS:?Missing MAIL_SUBJECT_CONTAINS (set repo Secret or Variable)}"
          : "${APPS_SCRIPT_WEBHOOK_URL:?Missing APPS_SCRIPT_WEBHOOK_URL (set repo Secret or Variable)}"
          : "${WEBHOOK_SECRET:?Missing WEBHOOK_SECRET (set repo Secret or Variable)}"

          cat > config.pop3.json <<'JSON'
          {
            "pop3": {
              "host": "__POP3_HOST__",
              "port": "__POP3_PORT__",
              "username": "__POP3_USERNAME__",
              "password": "__POP3_PASSWORD__",
              "use_ssl": true
            },
            "mail_filter": {
              "from_contains": "__MAIL_FROM_CONTAINS__",
              "subject_contains": "__MAIL_SUBJECT_CONTAINS__"
            },
            "google": {
              "target_sheet_name": "Rapor",
              "log_sheet_name": "Log"
            },
            "webhook": {
              "url": "__APPS_SCRIPT_WEBHOOK_URL__",
              "secret": "__WEBHOOK_SECRET__"
            },
            "state": {
              "processed_ids_path": "processed_ids.json"
            }
          }
          JSON

          sed -i "s|__POP3_HOST__|${POP3_HOST}|g" config.pop3.json
          sed -i "s|__POP3_PORT__|${POP3_PORT}|g" config.pop3.json
          sed -i "s|__POP3_USERNAME__|${POP3_USERNAME}|g" config.pop3.json
          sed -i "s|__POP3_PASSWORD__|${POP3_PASSWORD}|g" config.pop3.json
          sed -i "s|__MAIL_FROM_CONTAINS__|${MAIL_FROM_CONTAINS}|g" config.pop3.json
          sed -i "s|__MAIL_SUBJECT_CONTAINS__|${MAIL_SUBJECT_CONTAINS}|g" config.pop3.json
          sed -i "s|__APPS_SCRIPT_WEBHOOK_URL__|${APPS_SCRIPT_WEBHOOK_URL}|g" config.pop3.json
          sed -i "s|__WEBHOOK_SECRET__|${WEBHOOK_SECRET}|g" config.pop3.json

      - name: Run job
        run: python pop3_to_sheets.py

      - name: Upload processed state
        uses: actions/upload-artifact@v4
        with:
          name: processed-state
          path: processed_ids.json
          if-no-files-found: warn
